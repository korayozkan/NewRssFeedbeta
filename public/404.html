<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 404 SEO: Kesinlikle noindex olmalı, arama motorları dizine eklememeli -->
    <title>404: Sayfa Bulunamadı | NewRssFeed</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı. NewRssFeed ana sayfasına dönerek sosyal medya akışlarını tek bir yerden takip etmeye devam edin." />
    <meta name="robots" content="noindex, follow" />
    <meta name="googlebot" content="noindex, follow" />

    <!-- PWA & Mobil -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script>
      window.tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tema ve Dil Tercihi Kontrolü -->
    <script>
      (function(){
        try {
          var s = localStorage.getItem('nrf-theme');
          var p = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (s === 'dark' || (!s && p)) {
            document.documentElement.classList.add('dark');
          }
          var lang = localStorage.getItem('nrf-lang');
          if (lang === 'en') {
            document.documentElement.lang = 'en';
          }
        } catch (e) {}
      })();
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .dark body { background-color: #000; }
    </style>
  </head>
  <body class="bg-white dark:bg-black text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between antialiased transition-colors duration-200">
    
    <!-- Üst Basit Header -->
    <header class="w-full max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
      <a href="./" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform">
          N
        </div>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-purple-600 via-indigo-500 to-purple-400 bg-clip-text text-transparent">
          NewRssFeed
        </span>
      </a>

      <!-- Tema Değiştirici -->
      <button id="theme-btn" type="button" aria-label="Temayı Değiştir" class="p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-400 transition-colors">
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- 404 Ana İçerik -->
    <main class="flex-1 flex items-center justify-center px-6 py-12">
      <div class="max-w-xl w-full text-center">
        <!-- 404 Rozeti -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-semibold bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800/60 mb-6">
          <span class="w-2 h-2 rounded-full bg-purple-600 animate-pulse"></span>
          Hata 404 • Sayfa Bulunamadı
        </div>

        <!-- Büyük Başlık -->
        <h1 class="text-7xl md:text-9xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-gray-900 via-gray-700 to-gray-400 dark:from-white dark:via-gray-200 dark:to-gray-600 mb-4">
          404
        </h1>

        <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-gray-900 dark:text-white mb-3">
          Akışın Dışına Çıktınız
        </h2>

        <p class="text-base md:text-lg text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto leading-relaxed">
          Aradığınız sayfa taşınmış, silinmiş veya yanlış bir bağlantı girilmiş olabilir.
        </p>

        <!-- Eylem Butonları -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
          <a href="./" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3.5 rounded-xl font-semibold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 shadow-lg shadow-purple-600/25 hover:shadow-purple-600/35 transition-all transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Ana Sayfaya Dön
          </a>

          <a href="./#beta-form" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3.5 rounded-xl font-semibold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-800 transition-all">
            Kapalı Beta Kaydı
          </a>
        </div>
      </div>
    </main>

    <!-- Alt Footer -->
    <footer class="w-full max-w-6xl mx-auto px-6 py-6 text-center text-sm text-gray-400 dark:text-gray-600 border-t border-gray-100 dark:border-gray-900">
      &copy; 2026 NewRssFeed. Tüm hakları saklıdır.
    </footer>

    <!-- Tema Toggle Scripti -->
    <script>
      (function(){
        var btn = document.getElementById('theme-btn');
        if (!btn) return;
        btn.addEventListener('click', function() {
          var isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('nrf-theme', isDark ? 'dark' : 'light');
        });
      })();
    </script>
  </body>
</html>

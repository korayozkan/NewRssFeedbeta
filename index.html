    <!-- Tailwind CSS CDN — dark mode class strategy -->

    <script>
      tailwind.config = { darkMode: 'class' };
    </script>

    <!-- Flash-of-wrong-theme prevention -->
    <script>
      (function(){
        var s = localStorage.getItem('nrf-theme');
        var p = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (s === 'dark' || (!s && p)) {
          document.documentElement.classList.add('dark');
        }
        // Apply saved language
        var lang = localStorage.getItem('nrf-lang');
        if (lang === 'en') {
          document.documentElement.lang = 'en';
        }
      })();
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; }

      /* Dark mode: pure black backgrounds */
      .dark body { background-color: #000; }

      /* Active platform chip — light */
      .active-chip {
        border-color: rgb(147 51 234);
        color: rgb(126 34 206);
        background-color: rgb(245 243 255);
      }
      /* Active platform chip — dark */
      .dark .active-chip {
        border-color: rgb(167 139 250);
        color: rgb(196 181 253);
        background-color: rgb(76 29 149 / 0.3);
      }

      /* Smooth color transitions only — no transform flicker */
      *, *::before, *::after {
        transition-property: background-color, border-color, color;
        transition-duration: 200ms;
        transition-timing-function: ease;
      }
      .platform-pill, .platform-chip, button {
        transition-property: background-color, border-color, color, transform, opacity;
        transition-duration: 150ms;
      }
    </style>
